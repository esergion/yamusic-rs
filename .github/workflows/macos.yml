# Проверка macOS-порта в форке, без публикации бинарников и Developer ID.
name: macOS

on:
  push:
    branches: [main, macos-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: sh tools/test-macos-native.sh
      - run: python3 tools/macos-app.py
      - run: codesign --verify --deep --strict "target/macos/Яндекс Музыка RS.app"

